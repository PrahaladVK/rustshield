name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustshield/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rustshield/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check
        working-directory: rustshield

      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: rustshield

      - name: Build
        run: cargo build --verbose
        working-directory: rustshield

      - name: Test
        run: cargo test --verbose
        working-directory: rustshield

  gui:
    name: GUI (Tauri frontend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rustshield-gui/package-lock.json

      - run: npm ci
        working-directory: rustshield-gui

      - run: npm run build
        working-directory: rustshield-gui
